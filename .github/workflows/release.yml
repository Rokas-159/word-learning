name: Build Releases

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Zip PC version
        run: |
          cd www
          zip -r ../word-learning-pc.zip .

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install
      - run: npx cap sync android

      - name: Build Android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            word-learning-pc.zip
            android/app/build/outputs/apk/debug/app-debug.apk