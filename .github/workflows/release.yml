name: Build Releases

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22


      - name: Install dependencies
        run: npm ci


      - name: Create PC zip
        run: |
          cd www
          zip -r ../word-learning-pc-${{ github.ref_name }}.zip .


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21


      - name: Sync Capacitor
        run: npx cap sync android


      - name: Build Android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease


      - name: Rename APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/release/*.apk output/word-learning-android-${{ github.ref_name }}.apk


      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            word-learning-pc-${{ github.ref_name }}.zip
            output/word-learning-android-${{ github.ref_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}